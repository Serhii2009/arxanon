[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxanon"
version = "0.1.0"
description = "Cross-domain structural analogy discovery engine for AI/ML researchers"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Serhii Kravchenko", email = "serhiikravchenko@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "arxiv",
    "scientific-discovery",
    "embeddings",
    "cross-domain",
    "literature-based-discovery",
    "structural-analogy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "arxiv>=2.1.0",
    "requests>=2.31.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "hdbscan>=0.8.33",
    "ollama>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
tda = ["giotto-tda>=0.6.0"]

[project.urls]
Homepage = "https://github.com/Serhii2009/arxanon"
Repository = "https://github.com/Serhii2009/arxanon"
"Design Document" = "https://github.com/Serhii2009/arxanon/blob/main/ARXANON_DESIGN_DOCUMENT.md"
"Bug Tracker" = "https://github.com/Serhii2009/arxanon/issues"

[project.scripts]
arxanon = "arxanon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxanon"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
